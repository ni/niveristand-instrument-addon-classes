trigger:
  batch: true
  branches:
    include:
      - legacy

resources:
  repositories:
    - repository: niveristand-custom-device-build-tools
      type:       github
      ref:        main
      endpoint:   nivs-custom-devices
      name:       ni/niveristand-custom-device-build-tools

stages:
  - template: azure-templates/stages-legacy.yml@niveristand-custom-device-build-tools
    parameters:
      lvVersionsToBuild:
        - version: '2025'
          bitness: '64bit'
        - version: '2026'
          bitness: '64bit'

      buildSteps:
        - projectLocation: 'Source\Protections\Protections.lvproj'
          buildOperation: 'ExecuteBuildSpecAllTargets'
          target: 'All'
          buildSpec: 'Protections'

        - projectLocation: 'Source\Protocols\Protocols.lvproj'
          buildOperation: 'ExecuteBuildSpecAllTargets'
          target: 'All'
          buildSpec: 'Protocols'

      releaseVersion: '27.0.0'
      buildOutputLocation: 'Source\Built'
      archiveLocation: '\\nirvana\Measurements\VeriStandAddons\legacy\instrument_addon_classes'
      repoName: 'niveristand-instrument-addon-classes'
      createNetCoreRepo: false
